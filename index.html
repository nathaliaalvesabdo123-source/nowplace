<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NowPlace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <span class="logo-icon">📍</span>
      <h1>NowPlace</h1>
    </div>
    <p class="subtitle">O que está acontecendo agora?</p>
  </header>

  <main>
    <section id="view-create" class="view active">
      <div class="card">
        <div class="field-row">
          <div class="field">
            <label for="userName">Seu Nome</label>
            <input type="text" id="userName" placeholder="Como quer ser chamado?" maxlength="30" />
          </div>
          <div class="field">
            <label for="userMoment">O que está fazendo?</label>
            <input type="text" id="userMoment" placeholder="Ex: Tomando um café..." maxlength="50" />
          </div>
        </div>

        <div class="camera-container">
          <video id="camera" autoplay playsinline muted></video>
          <div id="cameraPlaceholder" class="placeholder">
            <span class="placeholder-icon">📷</span>
            <p>Câmera desligada</p>
          </div>
        </div>

        <div id="previewContainer" class="preview-container hidden">
          <div class="photo-box">
            <span class="photo-label">Ambiente</span>
            <img id="imgEnvironment" src="" alt="Foto do ambiente" />
          </div>
          <div class="photo-box">
            <span class="photo-label">Selfie</span>
            <img id="imgSelfie" src="" alt="Selfie" />
          </div>
        </div>

        <div class="controls" id="cameraControls">
          <button id="btnStartCam" class="btn btn-primary">Ligar Câmera</button>
          <button id="btnCaptureEnv" class="btn btn-secondary hidden">Tirar Foto do Ambiente</button>
          <button id="btnCaptureSelfie" class="btn btn-secondary hidden">Tirar Selfie</button>
        </div>

        <div class="controls hidden" id="actionControls">
          <button id="btnPublish" class="btn btn-success">Publicar Now</button>
          <button id="btnRestart" class="btn btn-danger">Recomeçar</button>
        </div>

        <div id="createStatus" class="status"></div>
      </div>
    </section>

    <section id="view-feed" class="view">
      <div class="feed-header">
        <h2>Perto de você</h2>
        <div class="search-controls">
          <div class="search-input-wrapper">
            <span>📍 Raio de</span>
            <input type="number" id="searchRadius" value="100" min="1" max="100" />
            <span>km</span>
          </div>
          <button id="btnSearch" class="btn btn-primary">Buscar</button>
        </div>
      </div>

      <div id="feedStatus" class="status"></div>
      <div id="feedContainer" class="feed-grid"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button id="navCreate" class="nav-btn active">
      <span class="nav-icon">➕</span> Criar Now
    </button>
    <button id="navFeed" class="nav-btn">
      <span class="nav-icon">🌍</span> Explorar
    </button>
  </nav>

  <div id="modalError" class="modal hidden">
    <div class="modal-content">
      <div class="modal-icon">⚠️</div>
      <h3>Atenção</h3>
      <p id="modalErrorText"></p>
      <button id="btnCloseModal" class="btn btn-primary">Entendi</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
